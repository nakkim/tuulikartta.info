services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    # published on the host so `npx prisma migrate dev` (run from the host,
    # using the DATABASE_URL in .env) can reach it
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      # containers talk to each other by service name, over the internal
      # compose network - not through the published host port above.
      # Credentials come from .env (read automatically by docker compose)
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "8080:80"
    # PHP runs with memory_limit=-1 as a CVE-2026-109618 mitigation (see
    # Dockerfile), so the container limit is what bounds memory use
    mem_limit: 1g
    memswap_limit: 1g

volumes:
  postgres-data:
