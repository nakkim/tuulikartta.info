  <script src="js/translations.js?v=2"></script>
  <script src="js/main.js?v=2"></script>
  <script src="js/color-scales.js?v=2"></script>
  <script src="js/wind-barbs.js?v=2"></script>
  <script src="js/synop-plot.js?v=2"></script>

  <script src="js/velocity.js?v=2"></script>
  <script src="js/divergence.js?v=2"></script>
  <script src="js/notifications.js?v=2"></script>
  <script src="js/markers.js?v=2"></script>
  <script src="js/map-controls.js?v=2"></script>
  <script src="js/ui-events.js?v=2"></script>
  <script src="js/graph.js?v=2"></script>
  <script src="js/lightning.js?v=2"></script>
  <!-- <script src="js/camera.js?v=2"></script> -->

  <link href="css/style.css" rel="stylesheet">
  <link href="css/temperature.css" rel="stylesheet">

  <script src="serviceWorker.js"></script>

  <script>
    $(document).ready(function () {
      var cal = $('#datepicker-button').datepicker({
        language: 'fi',
        format: 'dd.mm.yyyy',
        endDate: '+0d',
        autoclose: true,
        todayBtn: true,
        defaultDate: new Date()
      });
      cal.datepicker("setDate", 'now');
    })
  </script>

</head>

<body>

  <div id="gui-box" class="data-info" style="display: block">
    <div class="data-info-wrapper" align=center>
      <div class="select-box">

        <span class="select-content-wrapper" id="select-content-wrapper-timeselector">
          <input id="datepicker-button" class="select-button" style="text-align:center;max-width:105px;">
          <input id="clockpicker-button" class="select-button" style="text-align:center; max-width:60px;">
          <span class="ph-float">
            <a href='#' id="select-content-datasearch" class='ph-button ph-btn-blue inactive'>Hae</a>
          </span>
        </span>

        <span id="select-content-wrapper-time" class="select-content-wrapper">
          <button id="timepicker-regress-time" class="select-button">&laquo; 1h</button>
          <span class="ph-float">
            <a href='#' id="select-content-now" class='ph-button ph-btn-blue'>Nyt</a>
          </span>
          <button id="timepicker-progress-time" class="select-button">1h &raquo;</button>
        </span>
      </div>
      <span class="language-selector">
        <button id="language-selector-value" class="select-button">FI</button>
      </span>
    </div>
  </div>

  <div class="leaflet-top leaflet-left leaflet-control control-center" id="map-param">
    <div class="settings"></div>
    <span class="select-content-wrapper" id="main-navbar-param"></span>
  </div>

  <div class="leaflet-bottom leaflet-left leaflet-control-attribution leaflet-control">
    <div id="data-loader" class="info-container-data"></div>
    <div id="site-info" class="info-container" style="display:none;">
      <div id="site-info-body"></div>
    </div>
  </div>

  <div id="map" styles="z-index:1"></div>
  <div id="settings-sidebar"></div>

  <div id="modal-form" class="modal">
    <!-- Modal content -->
    <div class="modal-content">
      <span class="close">&times;</span>
      <b></b>
      <p id="observation-table-header">Säähavainnot</p>
      <div id="observation-table" class="data-table-container" style="height:90%;">
      </div>

    </div>
  </div>

  <div id="notification-banner" class="notification-banner" hidden>
    <span id="notification-banner-icon" class="notification-banner-icon"></span>
    <span id="notification-banner-text" class="notification-banner-text"></span>
    <a id="notification-banner-link" class="notification-banner-link" href="#" target="_blank" rel="noopener" hidden></a>
    <span id="notification-banner-close" class="notification-banner-close">&times;</span>
  </div>

</body>

<!-- Load auxiliary javascript ff -->
<script src="js/utils.js"></script>

</html>
